<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">Limiara documentation architecture</title>
  <desc id="description">Repository Markdown and OpenAPI flow through VitePress checks and a static build into preview and production deployments.</desc>
  <style>
    rect { fill: #f5f2e8; stroke: #16423c; stroke-width: 2; }
    text { fill: #172521; font: 17px system-ui, sans-serif; text-anchor: middle; }
    path { fill: none; stroke: #b55b39; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b55b39"/></marker></defs>
  <rect x="20" y="70" width="220" height="100" rx="14"/>
  <text x="130" y="112">Repository Markdown</text><text x="130" y="138">and OpenAPI</text>
  <rect x="370" y="70" width="220" height="100" rx="14"/>
  <text x="480" y="112">Checks + VitePress</text><text x="480" y="138">static build</text>
  <rect x="720" y="70" width="220" height="100" rx="14"/>
  <text x="830" y="112">Preview + production</text><text x="830" y="138">static hosting</text>
  <path d="M240 120 H360"/><path d="M590 120 H710"/>
</svg>

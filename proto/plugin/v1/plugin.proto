syntax = "proto3";
package plugin.v1;
message PluginIdentity { string id = 1; string version = 2; string runtime = 3; }
message Compatibility { string protocol_version = 1; string platform_range = 2; }
message HandshakeRequest { PluginIdentity identity = 1; Compatibility compatibility = 2; repeated string requested_capabilities = 3; }
message HandshakeResponse { bool accepted = 1; string reason = 2; repeated string granted_capabilities = 3; }
message HealthRequest { string correlation_id = 1; }
message HealthResponse { enum Status { STATUS_UNSPECIFIED = 0; SERVING = 1; DEGRADED = 2; NOT_SERVING = 3; } Status status = 1; string message = 2; }
message ValidateConfigurationRequest { string json_configuration = 1; }
message ValidateConfigurationResponse { bool valid = 1; repeated string errors = 2; }
message EventEnvelope { string id = 1; string type = 2; string tenant_id = 3; string correlation_id = 4; string payload_json = 5; }
message DeliverEventRequest { EventEnvelope event = 1; }
message DeliverEventResponse { bool acknowledged = 1; string error_code = 2; string error_message = 3; }
message ShutdownRequest { string reason = 1; }
message ShutdownResponse { bool accepted = 1; }
service ServicePlugin { rpc Handshake(HandshakeRequest) returns (HandshakeResponse); rpc Health(HealthRequest) returns (HealthResponse); rpc ValidateConfiguration(ValidateConfigurationRequest) returns (ValidateConfigurationResponse); rpc DeliverEvent(DeliverEventRequest) returns (DeliverEventResponse); rpc Shutdown(ShutdownRequest) returns (ShutdownResponse); }

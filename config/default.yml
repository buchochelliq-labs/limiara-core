platform:
  environment: development
  public_base_url: http://localhost:8080
  database:
    url: postgres://platform_app:platform_app@localhost:5432/platform
    max_connections: 10
    statement_timeout_ms: 5000
    acquire_timeout_ms: 3000
  oidc:
    issuer_url: http://auth.localhost:8081/realms/local
    client_id: platform-web
    redirect_url: http://localhost:8080/auth/oidc/callback
    post_logout_redirect_url: http://localhost:3000/
  nats:
    url: nats://localhost:4222
    stream: platform-events
    outbox:
      batch_size: 32
      max_in_flight: 8
      poll_interval_ms: 250
      claim_lease_seconds: 60
      publish_timeout_ms: 5000
      retry_base_ms: 1000
      retry_max_ms: 300000
      duplicate_window_seconds: 600
      stream_max_bytes: 1073741824
  worker:
    # RLS-bound runtime role for plugin consumers and jobs (local fixture).
    tenant_database_url: postgres://platform_app:platform_app@localhost:5432/platform
  sessions:
    cookie_name: platform_session
    ttl_seconds: 28800
    renewal_window_seconds: 1800
    cookie_secure: false
    same_site: Lax
  # Device apps that sign in through the system browser (ADR 0029). List
  # each app build's redirect URI, such as com.example.app:/oauth; empty
  # turns device sign-in off.
  devices:
    redirect_uris: []
    offline_limit_seconds: 1209600
    push:
      quiet_seconds: 180
  health:
    check_timeout_ms: 1000
  plugins:
    manifest_paths:
      - plugins/contacts/plugin.toml
    reserved_namespaces:
      - platform
    trusted_core_repositories:
      - https://github.com/buchochelliq-labs/limiara-core
    trusted_provenance_hosts:
      - github.com
  services:
    api_bind: 0.0.0.0:8080
    worker_bind: 0.0.0.0:8080
    plugin_runner_bind: 0.0.0.0:8080
  external_hosts: {}
  storage:
    object:
      provider: local
      bucket: platform-dev
    cache:
      provider: memory
    graph:
      provider: none

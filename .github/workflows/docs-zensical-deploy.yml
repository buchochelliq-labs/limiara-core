name: docs-zensical-publish

# Deploys the Zensical build of docs/ (apps/docs-zensical) to its own
# Cloudflare Pages project, next to the VitePress site (docs-deploy.yml).
# It mirrors that workflow: the build job holds no secrets, previews
# deploy only for pull requests from this repository, and production
# deploys from main through the protected docs-production environment.
# Nothing deploys until the repository variable
# DOCS_ZENSICAL_DEPLOY_ENABLED is 'true'. Every deployment is noindex:
# the site is under evaluation (ADR 0008).

on:
  pull_request:
    paths:
      - "docs/**"
      - "apps/docs-zensical/**"
      - ".github/workflows/docs-zensical-deploy.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/docs-zensical/**"
      - ".github/workflows/docs-zensical-deploy.yml"
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Deployment target; production requires the protected docs-production environment
        required: true
        default: preview
        type: choice
        options: [preview, production]
      source_ref:
        description: Reviewed branch, tag, or commit to build (use a retained production SHA for rollback)
        required: true
        default: main
        type: string

concurrency:
  group: docs-zensical-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: docs-zensical-publish-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCS_DEPLOYMENT_ENV: ${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.deployment_environment || 'production') }}
      DOCS_SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/docs-zensical/requirements.txt
      - run: pip install -r apps/docs-zensical/requirements.txt
      - run: apps/docs-zensical/build.sh
      - run: python3 apps/docs-zensical/scripts/prepare_deployment.py "$DOCS_DEPLOYMENT_ENV" "$DOCS_SOURCE_REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-zensical-site-${{ github.sha }}
          path: apps/docs-zensical/build/site
          if-no-files-found: error
          retention-days: 90

  preview:
    name: docs-zensical-preview
    needs: build
    if: >-
      vars.DOCS_ZENSICAL_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_environment == 'preview'))
    runs-on: ubuntu-24.04
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-zensical-site-${{ github.sha }}
          path: site
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.68.0"
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_ZENSICAL_PAGES_PROJECT }} --branch=preview-${{ github.event.pull_request.number || github.run_id }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  production:
    name: docs-zensical-production
    needs: build
    if: >-
      vars.DOCS_ZENSICAL_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_environment == 'production'))
    runs-on: ubuntu-24.04
    environment:
      name: docs-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-zensical-site-${{ github.sha }}
          path: site
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.68.0"
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_ZENSICAL_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

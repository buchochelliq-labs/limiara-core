name: testflight
# Builds the iOS app shell (apps/device-shell, app.limiara.shell) in release
# mode, signs it for App Store distribution and uploads it to App Store
# Connect, where it appears in TestFlight. The owner's runbook, with every
# secret and the Apple portal steps, is docs/operations/testflight.md.
#
# It runs only when someone asks: a manual dispatch, or a pushed `ios-v*`
# tag. It never runs for pull requests, so no fork can reach the signing
# material, which lives in the `testflight` environment.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion to use instead of the run number (one to three dot-separated integers, higher than any earlier upload)"
        required: false
        default: ""
      keep_ipa:
        description: "Keep the signed .ipa as a workflow artifact for 7 days"
        type: boolean
        required: false
        default: false
  push:
    tags: ["ios-v*"]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    # A fork's copy of this workflow has neither the environment nor its
    # secrets; stop before a macOS runner is spent on it.
    if: ${{ !github.event.repository.fork }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    env:
      APP_DIR: apps/device-shell/src-tauri
    steps:
      - name: Check the signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          # Names only: no value is ever printed.
          missing=()
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          # Manual signing is all three secrets or none of them.
          manual=(IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_STORE_PROFILE_BASE64)
          present=0
          for name in "${manual[@]}"; do [[ -n "${!name}" ]] && present=$((present + 1)); done
          if ((present > 0 && present < ${#manual[@]})); then
            for name in "${manual[@]}"; do [[ -n "${!name}" ]] || missing+=("$name"); done
          fi
          if ((${#missing[@]} > 0)); then
            echo "::error title=Missing secrets::The testflight environment is missing: ${missing[*]}. See docs/operations/testflight.md."
            exit 1
          fi
          if [[ ! "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_ID must be the key's ID (letters and digits), not the key itself."
            exit 1
          fi
          if ((present > 0)); then mode=manual; else mode=automatic; fi
          {
            echo "SIGNING_MODE=$mode"
            # Everything sensitive lives here; the last step removes it.
            echo "SIGNING_DIR=$RUNNER_TEMP/signing"
          } >>"$GITHUB_ENV"
          echo "Signing secrets present; signing mode: $mode"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Work out the versions
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          short_version=$(jq -r '.version' "$APP_DIR/tauri.conf.json")
          [[ "$short_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::tauri.conf.json version '$short_version' is not MAJOR.MINOR.PATCH"; exit 1; }
          # A pushed tag must name the version it builds.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "ios-v$short_version" ]] ||
              { echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $short_version (expected ios-v$short_version)"; exit 1; }
          fi
          # Every upload needs a CFBundleVersion App Store Connect has not
          # seen. The run number grows with each run; a re-run of the same
          # run adds its attempt, which still sorts after the first attempt.
          if [[ -n "$INPUT_BUILD_NUMBER" ]]; then
            build="$INPUT_BUILD_NUMBER"
          elif ((RUN_ATTEMPT > 1)); then
            build="$RUN_NUMBER.$RUN_ATTEMPT"
          else
            build="$RUN_NUMBER"
          fi
          [[ "$build" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] ||
            { echo "::error::build number '$build' must be one to three dot-separated integers"; exit 1; }
          {
            echo "SHORT_VERSION=$short_version"
            echo "BUILD_NUMBER=$build"
          } >>"$GITHUB_ENV"
          echo "Building $short_version ($build)"

      # The App Store accepts only builds made with Xcode 26 or later and an
      # iOS 26 SDK (Apple's upcoming requirements, since 28 April 2026).
      - name: Check Xcode
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          ((major >= 26)) || { echo "::error::Xcode $major is too old for App Store uploads; Xcode 26 or later is required"; exit 1; }

      # The toolchain of the `ios` workflow. No dependency cache: a release
      # build restores nothing another workflow could have written.
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: "aarch64-apple-ios" }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      # The CLI this workflow was written against, matching the `tauri`
      # crate in the app's Cargo.lock.
      - run: cargo install tauri-cli --version "=2.12.5" --locked

      - name: Build the web shell
        run: |
          pnpm --filter web build
          bash scripts/check-ios-release-build.sh self-test
          bash scripts/check-ios-release-build.sh web apps/web/dist

      - name: Install the signing material
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$SIGNING_DIR/private_keys"
          # The App Store Connect API key: Tauri reads it through
          # APPLE_API_KEY_PATH, and altool finds AuthKey_<id>.p8 in
          # API_PRIVATE_KEYS_DIR.
          key="$SIGNING_DIR/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          # Whitespace and line breaks in the pasted secret are ignored.
          decoded="$SIGNING_DIR/AuthKey.decoded"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | tr -d ' \t\r\n' | base64 --decode >"$decoded" ||
            { echo "::error::APP_STORE_CONNECT_API_KEY_P8_BASE64 is not valid base64"; exit 1; }
          grep -q 'BEGIN PRIVATE KEY' "$decoded" ||
            { echo "::error::APP_STORE_CONNECT_API_KEY_P8_BASE64 does not decode to a .p8 private key"; exit 1; }
          # Xcode reads the key with CryptoKit, which accepts only a clean
          # PEM document. A file saved or encoded on Windows can carry a
          # byte-order mark or CRLF line endings, so re-write the key
          # through OpenSSL, which also checks it is an EC private key.
          # Only these facts are logged, never the key.
          if LC_ALL=C grep -q $'\r' "$decoded"; then echo "The decoded key had CRLF line endings; normalising them."; fi
          if [[ "$(head -c 3 "$decoded" | od -An -tx1 | tr -d ' \n')" == efbbbf ]]; then echo "The decoded key began with a byte-order mark; removing it."; fi
          LC_ALL=C sed -e $'1s/^\xef\xbb\xbf//' -e $'s/\r$//' "$decoded" >"$decoded.lf"
          if ! openssl pkey -in "$decoded.lf" -out "$key" 2>/dev/null ||
            ! openssl pkey -in "$key" -noout -text 2>/dev/null | grep -q 'ASN1 OID: prime256v1'; then
            rm -f "$decoded" "$decoded.lf" "$key"
            echo "::error::APP_STORE_CONNECT_API_KEY_P8_BASE64 decodes to a file that is not a valid App Store Connect key (an EC P-256 private key); encode the AuthKey_<Key ID>.p8 file exactly as downloaded"
            exit 1
          fi
          rm -f "$decoded" "$decoded.lf"
          chmod 600 "$key"
          {
            echo "APPLE_API_KEY_PATH=$key"
            echo "API_PRIVATE_KEYS_DIR=$SIGNING_DIR/private_keys"
          } >>"$GITHUB_ENV"

          [[ "$SIGNING_MODE" == manual ]] || exit 0
          # Manual signing: Tauri imports the certificate itself
          # (IOS_CERTIFICATE in the build step) into a temporary keychain
          # it deletes when it exits. Check first that the secret is the
          # team's Apple Distribution certificate, with its password.
          certificate="$SIGNING_DIR/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode >"$certificate"
          chmod 600 "$certificate"
          certificates="$SIGNING_DIR/distribution-certificates.pem"
          # Keychain Access may export with legacy encryption, which
          # OpenSSL 3 reads only with -legacy.
          if ! openssl pkcs12 -in "$certificate" -nokeys -clcerts -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD -out "$certificates" 2>/dev/null &&
            ! openssl pkcs12 -legacy -in "$certificate" -nokeys -clcerts -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD -out "$certificates" 2>/dev/null; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 could not be opened with IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
            exit 1
          fi
          # A certificate's subject is not secret: it names the
          # certificate type, the team and its expiry.
          subject=$(openssl x509 -in "$certificates" -noout -subject -nameopt multiline)
          expiry=$(openssl x509 -in "$certificates" -noout -enddate)
          rm -f "$certificate" "$certificates"
          grep -Eq 'commonName += (Apple|iPhone) Distribution:' <<<"$subject" ||
            { echo "::error::IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 is not an Apple Distribution certificate"; exit 1; }
          grep -Eq "organizationalUnitName += ${APPLE_TEAM_ID}\$" <<<"$subject" ||
            { echo "::error::the distribution certificate does not belong to APPLE_TEAM_ID"; exit 1; }
          echo "Distribution certificate found; ${expiry}"
          # The clean-up step deletes any keychain Tauri leaves behind,
          # for example if the build is cancelled.
          find "$HOME/Library/Keychains" -maxdepth 1 -name '*.keychain-db' >"$SIGNING_DIR/keychains-before.txt"

      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          # Optional: the export compliance code App Store Connect issues
          # for the app's encryption documentation. It is not secret (it
          # ships in every build's Info.plist) but belongs to one account,
          # so it lives in the environment, not the repository.
          EXPORT_COMPLIANCE_CODE: ${{ vars.APP_STORE_EXPORT_COMPLIANCE_CODE }}
        run: |
          cd "$APP_DIR"
          if [[ -n "$EXPORT_COMPLIANCE_CODE" ]]; then
            [[ "$EXPORT_COMPLIANCE_CODE" =~ ^[A-Za-z0-9._-]{1,128}$ ]] ||
              { echo "::error::APP_STORE_EXPORT_COMPLIANCE_CODE must be the code exactly as App Store Connect shows it (letters, digits, dots, dashes)"; exit 1; }
            # Into the plist Tauri merges into the app's Info.plist, before
            # the project is generated and built from it.
            /usr/libexec/PlistBuddy -c "Add :ITSEncryptionExportComplianceCode string $EXPORT_COMPLIANCE_CODE" Info.ios.plist
          fi
          cargo tauri ios init --ci
          # Tauri's configuration has no iOS entitlements, so the committed
          # file replaces the generated one, as in the `ios` workflow. A
          # distribution build registers with production APNs.
          entitlements=$(find gen/apple -maxdepth 2 -name '*.entitlements' | head -n 1)
          [[ -n "$entitlements" ]] || { echo "::error::the generated iOS project has no entitlements file"; exit 1; }
          cp Entitlements.ios.plist "$entitlements"
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' "$entitlements"

      - name: Build, sign and export the IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # Passed to Tauri only in manual mode; empty otherwise.
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          cd "$APP_DIR"
          if [[ "$SIGNING_MODE" == manual ]]; then
            # Tauri's manual signing (tauri-cli 2.12.5): it decodes the
            # base64 .p12 into a temporary keychain, writes its identity
            # and team and the profile's UUID into the Xcode project, and
            # the export signs with that identity and profile.
            export IOS_CERTIFICATE="$CERTIFICATE_BASE64"
            export IOS_CERTIFICATE_PASSWORD="$CERTIFICATE_PASSWORD"
            export IOS_MOBILE_PROVISION="$PROFILE_BASE64"
          fi
          unset CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64
          # Automatic signing: with the API key, Xcode creates or reuses
          # the distribution certificate and profile itself
          # (-allowProvisioningUpdates with the authentication key).
          config=$(jq -cn --arg build "$BUILD_NUMBER" '{bundle: {iOS: {bundleVersion: $build}}}')
          cargo tauri ios build --ci --target aarch64 --export-method app-store-connect --config "$config"
          ipa=$(find gen/apple/build -name '*.ipa' -type f | head -n 1)
          [[ -n "$ipa" ]] || { echo "::error::the build produced no .ipa"; exit 1; }
          echo "IPA_PATH=$PWD/$ipa" >>"$GITHUB_ENV"

      - name: Check the release build
        env:
          EXPORT_COMPLIANCE_CODE: ${{ vars.APP_STORE_EXPORT_COMPLIANCE_CODE }}
        run: bash scripts/check-ios-release-build.sh ipa "$IPA_PATH" "$BUILD_NUMBER" "$SHORT_VERSION"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          # Optional: the app's numeric Apple ID, for accounts where altool
          # cannot tell the app from its bundle identifier alone.
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
        run: |
          args=(--upload-app -f "$IPA_PATH" --platform ios
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" --api-issuer "$APP_STORE_CONNECT_API_ISSUER_ID")
          [[ -z "$APP_STORE_APP_ID" ]] || args+=(--apple-id "$APP_STORE_APP_ID")
          log="$SIGNING_DIR/altool.log"
          status=0
          xcrun altool "${args[@]}" >"$log" 2>&1 || status=$?
          cat "$log"
          # altool has reported failures with a zero exit status, so its
          # output must also say the upload succeeded.
          if ((status != 0)) || ! grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' "$log"; then
            echo "::error::the upload to App Store Connect failed (altool exit status $status)"
            # 90592: the app's encryption documentation has a compliance
            # code, and the build does not carry it.
            if grep -q '90592' "$log"; then
              echo "::error::App Store Connect expects an export compliance code: set the testflight environment variable APP_STORE_EXPORT_COMPLIANCE_CODE (docs/operations/testflight.md, Export compliance)"
            fi
            exit 1
          fi
          {
            echo "### TestFlight upload"
            echo
            echo "Uploaded \`app.limiara.shell\` $SHORT_VERSION ($BUILD_NUMBER). App Store Connect processes it before it appears in TestFlight."
          } >>"$GITHUB_STEP_SUMMARY"

      # The IPA holds the signed app and no signing secrets; it is kept
      # only when asked for, and briefly.
      - name: Keep the IPA
        if: ${{ inputs.keep_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: limiara-ios-${{ env.SHORT_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Remove the signing material
        if: ${{ always() }}
        run: |
          # Tauri deletes its temporary keychain when it exits; delete any
          # it left, such as after a cancelled run.
          before="${SIGNING_DIR:-}/keychains-before.txt"
          if [[ -f "$before" ]]; then
            find "$HOME/Library/Keychains" -maxdepth 1 -name '*.keychain-db' | while IFS= read -r keychain; do
              grep -qxF -e "$keychain" "$before" || security delete-keychain "$keychain" || true
            done
          fi
          # Profiles Tauri installed (manual) or Xcode downloaded
          # (automatic) on this ephemeral runner.
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          if [[ -n "${SIGNING_DIR:-}" ]]; then rm -rf "$SIGNING_DIR"; fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Limiara">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.55" stop-color="#f8e3b8"/>
      <stop offset="1" stop-color="#e9d6a4"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="#0b4f3a"/>
  <!-- bulb glass -->
  <path d="M32 9c-10.5 0-18 7.6-18 17.2 0 5.3 2.4 8.9 5.2 12 2.2 2.4 3.8 4.5 3.8 7.3V47h18v-1.5c0-2.8 1.6-4.9 3.8-7.3 2.8-3.1 5.2-6.7 5.2-12C50 16.6 42.5 9 32 9z" fill="url(#glow)" stroke="#fdfcf9" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- glass glint -->
  <path d="M21.5 23.5c1-4 3.6-7 7.2-8.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <!-- base -->
  <rect x="24" y="47" width="16" height="4" rx="1.5" fill="#fdfcf9"/>
  <rect x="25.5" y="52.5" width="13" height="2.6" rx="1.3" fill="#d7dbde"/>
  <!-- filament support wires -->
  <path d="M30.1 46.5V38.6M37.2 46.5V38.6" fill="none" stroke="#6b4fbb" stroke-width="1.4" stroke-linecap="round"/>
  <!-- the elephant filament (tiny: scaled around the glass centre) -->
  <g fill="#6b4fbb" transform="translate(32 33) scale(0.78) translate(-32 -33)">
    <!-- body -->
    <ellipse cx="33.2" cy="31.6" rx="6.4" ry="4.6"/>
    <!-- legs -->
    <rect x="28.2" y="34" width="2.4" height="5.2" rx="1"/>
    <rect x="31.4" y="34.6" width="2.4" height="4.6" rx="1"/>
    <rect x="34.8" y="34.6" width="2.4" height="4.6" rx="1"/>
    <rect x="37.6" y="34" width="2.4" height="5.2" rx="1"/>
    <!-- head and ear -->
    <circle cx="26.3" cy="29.4" r="3.9"/>
    <circle cx="27.6" cy="29.2" r="2.3" fill="#8a6fd6"/>
    <!-- trunk -->
    <path d="M23.2 30.3c-1.9 1.2-2.6 3.4-1.6 5.4.5 1 1.6 1.5 2.5 1.1" fill="none" stroke="#6b4fbb" stroke-width="2.2" stroke-linecap="round"/>
    <!-- tusk -->
    <path d="M24.6 31.8c-.6.6-.6 1.4-.1 2" fill="none" stroke="#fdfcf9" stroke-width="1" stroke-linecap="round"/>
    <!-- tail -->
    <path d="M39.4 30.2c1.4-.2 2.2.8 2 2.1" fill="none" stroke="#6b4fbb" stroke-width="1.3" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="25.1" cy="28.5" r=".65" fill="#fdfcf9"/>
  </g>
</svg>

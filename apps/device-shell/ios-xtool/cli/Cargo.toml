[package]
name = "limiara-sideload"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
description = "Guided setup for sideloading the iOS shell with xtool from Windows (WSL)"

# A standalone package, built on its own (see ../README.md); it is not a
# member of the repository's root workspace.
[workspace]

[[bin]]
name = "limiara-sideload"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
intuituive = { package = "rs-rich-intuituive", version = "=0.0.12", default-features = false }
rich = { package = "rs-rich", version = "=0.0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true

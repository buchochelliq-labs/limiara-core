[package]
name = "device-route-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
publish = false
description = "A test plugin that receives the current-route context on every platform, as a Tauri plugin."
# Tauri finds a plugin's Android library and Swift package through this key.
links = "tauri-plugin-device-route-probe"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1.0"

# Denied, not forbidden: the iOS plugin binding Tauri generates declares a
# Swift entry point through FFI. That one binding is allowed in src/lib.rs,
# as in `device-push` (ADR 0030 §5); nothing else may use `unsafe`.
[lints.rust]
unsafe_code = "deny"

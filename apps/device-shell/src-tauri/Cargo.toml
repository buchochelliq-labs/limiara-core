[package]
name = "device-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
publish = false
description = "The Limiara app shell for desktop and mobile: the web shell over the local command bridge."

# Its own workspace: it links the platform's GUI libraries (WebKitGTK on
# Linux), which the server workspace must not need.
[workspace]
members = ["browser", "keystore", "push", "route-probe"]

[lib]
name = "device_shell"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "device-shell"
path = "src/main.rs"
required-features = ["entry-point"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = "0.4"
device-browser = { path = "browser" }
device-keystore = { path = "keystore" }
device-push = { path = "push" }
device-route-probe = { path = "route-probe" }
http = "1.1"
platform-device = { path = "../../../crates/platform-device" }
platform-objects = { path = "../../../crates/platform-objects" }
plugin-contract = { path = "../../../crates/plugin-contract" }
serde = "1.0"
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

# The desktop's default browser for sign-in. Phones sign in through
# ASWebAuthenticationSession and Custom Tabs instead (`browser/`).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
open = "5"

# The platform keychain (src/keychain.rs). Android has no keyring backend
# and uses the Keystore plugin (`keystore/`) instead.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3"

[features]
# Serve the embedded web build rather than a development server.
default = ["custom-protocol", "entry-point"]
custom-protocol = ["tauri/custom-protocol"]
# The shell's own app: `app::run` with this crate's Tauri configuration and
# web build, the desktop binary and the iOS and Android entry point. An app
# crate that builds the app with `app::AppBuilder`, its own configuration
# and native plugins of its own turns it off, so the mobile library has
# exactly one entry point and this crate embeds no web build.
entry-point = []

[lints.rust]
unsafe_code = "forbid"

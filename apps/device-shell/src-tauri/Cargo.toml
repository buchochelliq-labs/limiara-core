[package]
name = "device-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
publish = false
description = "The Limiara app shell for desktop and mobile: the web shell over the local command bridge."

# Its own workspace: it links the platform's GUI libraries (WebKitGTK on
# Linux), which the server workspace must not need.
[workspace]
members = ["browser", "keystore"]

[lib]
name = "device_shell"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "device-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
device-browser = { path = "browser" }
device-keystore = { path = "keystore" }
http = "1.1"
platform-device = { path = "../../../crates/platform-device" }
platform-objects = { path = "../../../crates/platform-objects" }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

# The desktop's default browser for sign-in. Phones sign in through
# ASWebAuthenticationSession and Custom Tabs instead (`browser/`).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
open = "5"

# The platform keychain (src/keychain.rs). Android has no keyring backend
# and uses the Keystore plugin (`keystore/`) instead.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3"

[features]
# Serve the embedded web build rather than a development server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"

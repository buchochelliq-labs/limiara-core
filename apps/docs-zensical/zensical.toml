# A Zensical build of the documentation in `docs/`, kept alongside the
# VitePress site (`apps/docs`) to compare the two. `scripts/stage.py`
# stages the public pages into `build/src`, writes this file with the
# navigation into `build/zensical.toml`, and that file is what Zensical
# builds. Edit this file, not the generated one.

[project]
site_name = "Limiara docs"
site_description = "Documentation for the open, composable Limiara business platform."
site_url = "https://docs.limiara.org/"
repo_url = "https://github.com/buchochelliq-labs/limiara-core"
repo_name = "limiara-core"
edit_uri = "edit/main/docs/"
copyright = "Limiara contributors"
docs_dir = "src"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/extra.css"]
# nav: generated by scripts/stage.py from the VitePress sidebar.

[project.theme]
language = "en"
logo = "architecture-overview.svg"
favicon = "architecture-overview.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
